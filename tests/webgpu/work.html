<!doctype html><meta charset="utf-8"><title>webgpu work</title><pre id="o">running</pre>
<script>
// WebGPU on the adapter Dawn picks: a compute pass, a render pass with a
// uniform buffer, a textured draw; every result is read back and checked.
const out = [];
const log = (...a) => { out.push(a.join(' ')); document.getElementById('o').textContent = out.join('\n'); console.log('WGPU ' + a.join(' ')); };

async function readBuffer(device, src, size) {
  const rb = device.createBuffer({ size, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const enc = device.createCommandEncoder();
  enc.copyBufferToBuffer(src, 0, rb, 0, size);
  device.queue.submit([enc.finish()]);
  await rb.mapAsync(GPUMapMode.READ);
  const copy = rb.getMappedRange().slice(0);
  rb.unmap();
  return copy;
}

async function readTexture(device, tex, w, h) {
  const bpr = Math.ceil(w * 4 / 256) * 256;
  const rb = device.createBuffer({ size: bpr * h, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const enc = device.createCommandEncoder();
  enc.copyTextureToBuffer({ texture: tex }, { buffer: rb, bytesPerRow: bpr, rowsPerImage: h }, [w, h, 1]);
  device.queue.submit([enc.finish()]);
  await rb.mapAsync(GPUMapMode.READ);
  const data = new Uint8Array(rb.getMappedRange().slice(0));
  rb.unmap();
  return { data, bpr };
}

function countPixels(img, w, h, r, g, b) {
  let n = 0;
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const o = y * img.bpr + x * 4;
      if (Math.abs(img.data[o] - r) <= 1 && Math.abs(img.data[o + 1] - g) <= 1 &&
          Math.abs(img.data[o + 2] - b) <= 1) n++;
    }
  return n;
}

(async () => {
  try {
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) { log('RESULT no adapter'); return; }
    const i = adapter.info || {};
    log('adapter: vendor', i.vendor, 'architecture', i.architecture, 'description', i.description);
    const device = await adapter.requestDevice();
    device.lost.then(l => log('DEVICE LOST:', l.reason, l.message));
    device.addEventListener('uncapturederror', e => log('UNCAPTURED ERROR:', e.error.message));

    // W1: compute: out[i] = in[i] * 2 + i
    {
      const N = 1024;
      const input = new Uint32Array(N).map((_, k) => k * 3 + 1);
      const inBuf = device.createBuffer({ size: N * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
      device.queue.writeBuffer(inBuf, 0, input);
      const outBuf = device.createBuffer({ size: N * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
      const mod = device.createShaderModule({ code: `
        @group(0) @binding(0) var<storage, read> a : array<u32>;
        @group(0) @binding(1) var<storage, read_write> b : array<u32>;
        @compute @workgroup_size(64) fn main(@builtin(global_invocation_id) id : vec3u) {
          if (id.x < arrayLength(&a)) { b[id.x] = a[id.x] * 2u + id.x; }
        }` });
      const pipe = await device.createComputePipelineAsync({ layout: 'auto', compute: { module: mod, entryPoint: 'main' } });
      const bg = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [
        { binding: 0, resource: { buffer: inBuf } }, { binding: 1, resource: { buffer: outBuf } } ] });
      const enc = device.createCommandEncoder();
      const pass = enc.beginComputePass();
      pass.setPipeline(pipe); pass.setBindGroup(0, bg); pass.dispatchWorkgroups(N / 64); pass.end();
      device.queue.submit([enc.finish()]);
      const res = new Uint32Array(await readBuffer(device, outBuf, N * 4));
      let bad = 0;
      for (let k = 0; k < N; k++) if (res[k] !== ((input[k] * 2 + k) >>> 0)) bad++;
      log('W1 compute:', bad, 'of', N, 'words wrong (word 5 =', res[5], ', expect', input[5] * 2 + 5, ')');
    }

    // W2: render: one triangle in a colour from a uniform buffer, after the compute pass
    {
      const W = 64, H = 64;
      const tex = device.createTexture({ size: [W, H], format: 'rgba8unorm',
        usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
      const ubo = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
      device.queue.writeBuffer(ubo, 0, new Float32Array([0.2, 0.6, 1.0, 1.0]));
      const mod = device.createShaderModule({ code: `
        @group(0) @binding(0) var<uniform> colour : vec4f;
        @vertex fn vs(@builtin(vertex_index) v : u32) -> @builtin(position) vec4f {
          var p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(-1.0, 1.0));
          return vec4f(p[v], 0.0, 1.0);
        }
        @fragment fn fs() -> @location(0) vec4f { return colour; }` });
      const pipe = await device.createRenderPipelineAsync({ layout: 'auto',
        vertex: { module: mod, entryPoint: 'vs' },
        fragment: { module: mod, entryPoint: 'fs', targets: [{ format: 'rgba8unorm' }] } });
      const bg = device.createBindGroup({ layout: pipe.getBindGroupLayout(0),
        entries: [{ binding: 0, resource: { buffer: ubo } }] });
      const enc = device.createCommandEncoder();
      const pass = enc.beginRenderPass({ colorAttachments: [{ view: tex.createView(),
        clearValue: [0, 0, 0, 1], loadOp: 'clear', storeOp: 'store' }] });
      pass.setPipeline(pipe); pass.setBindGroup(0, bg); pass.draw(3); pass.end();
      device.queue.submit([enc.finish()]);
      const img = await readTexture(device, tex, W, H);
      log('W2 render with a uniform colour:', countPixels(img, W, H, 51, 153, 255), 'triangle pixels (expect about 2016),',
          countPixels(img, W, H, 0, 0, 0), 'clear pixels (expect about 2080)');
    }

    // W3: a 2x2 texture sampled over the whole target (nearest)
    {
      const W = 64, H = 64;
      const src = device.createTexture({ size: [2, 2], format: 'rgba8unorm',
        usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST });
      device.queue.writeTexture({ texture: src }, new Uint8Array([255, 0, 0, 255, 0, 255, 0, 255,
        0, 0, 255, 255, 255, 255, 0, 255]), { bytesPerRow: 8 }, [2, 2]);
      const dst = device.createTexture({ size: [W, H], format: 'rgba8unorm',
        usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
      const samp = device.createSampler({ magFilter: 'nearest', minFilter: 'nearest' });
      const mod = device.createShaderModule({ code: `
        @group(0) @binding(0) var t : texture_2d<f32>;
        @group(0) @binding(1) var s : sampler;
        struct V { @builtin(position) pos : vec4f, @location(0) uv : vec2f }
        @vertex fn vs(@builtin(vertex_index) v : u32) -> V {
          var p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
          var o : V;
          o.pos = vec4f(p[v], 0.0, 1.0);
          o.uv = vec2f(p[v].x * 0.5 + 0.5, 0.5 - p[v].y * 0.5);
          return o;
        }
        @fragment fn fs(i : V) -> @location(0) vec4f { return textureSample(t, s, i.uv); }` });
      const pipe = await device.createRenderPipelineAsync({ layout: 'auto',
        vertex: { module: mod, entryPoint: 'vs' },
        fragment: { module: mod, entryPoint: 'fs', targets: [{ format: 'rgba8unorm' }] } });
      const bg = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [
        { binding: 0, resource: src.createView() }, { binding: 1, resource: samp } ] });
      const enc = device.createCommandEncoder();
      const pass = enc.beginRenderPass({ colorAttachments: [{ view: dst.createView(),
        clearValue: [0, 0, 0, 1], loadOp: 'clear', storeOp: 'store' }] });
      pass.setPipeline(pipe); pass.setBindGroup(0, bg); pass.draw(3); pass.end();
      device.queue.submit([enc.finish()]);
      const img = await readTexture(device, dst, W, H);
      log('W3 textured draw: red', countPixels(img, W, H, 255, 0, 0), 'green', countPixels(img, W, H, 0, 255, 0),
          'blue', countPixels(img, W, H, 0, 0, 255), 'yellow', countPixels(img, W, H, 255, 255, 0), '(expect 1024 each)');
    }

    await device.queue.onSubmittedWorkDone();
    log('RESULT done');
  } catch (e) { log('RESULT exception:', e && (e.message || e)); }
  document.title = 'done';
})();
</script>
